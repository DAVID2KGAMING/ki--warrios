<style>
/* Layout concept: one full-bleed canvas; every screen (menu, modes, select, combat, results) is drawn by a screen manager. */
:root {
  --void: #070b1f;        /* night sky */
  --dusk: #2a1a52;        /* horizon violet */
  --ki: #38bdf8;          /* ki cyan */
  --flare: #fbbf24;       /* transform gold */
  --ink: #f1f5f9;
  --font-display: "Bungee", Impact, sans-serif;
  --font-body: "Rajdhani", "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
#stage { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
</style>
<canvas id="stage" tabindex="0" aria-label="Stickman Ki Warriors game canvas"></canvas>
<script>
(() => {
'use strict';
/* ============================================================
   0. UTILITIES
   ============================================================ */
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
let W = 800, H = 450, DPR = 1;
function resize() { DPR = Math.min(window.devicePixelRatio || 1, 2); W = cv.clientWidth || 800; H = cv.clientHeight || 450; cv.width = W * DPR; cv.height = H * DPR; }
addEventListener('resize', resize); resize();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const U = () => clamp(Math.min(W / 1000, H / 600), 0.55, 1.6);
const FD = '"Bungee", Impact, sans-serif', FB = '"Rajdhani", "Segoe UI", sans-serif';
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function txt(s, x, y, size, color, align = 'left', font = FB, weight = 700) {
  ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(s, x, y);
}

/* ============================================================
   1. INPUT  (keyboard + touch/pointer, virtual 1640x720 UI space)
   ============================================================ */
const VW = 1640, VH = 720;
let VS = 1, VOX = 0, VOY = 0;
function vcalc() { VS = Math.min(W / VW, H / VH); VOX = (W - VW * VS) / 2; VOY = (H - VH * VS) / 2; }
const toV = (x, y) => [(x - VOX) / VS, (y - VOY) / VS];

const down = new Set(), pressed = new Set();
const TCH = { held: new Set(), edge: new Set(), joy: { id: null, ax: 0, ay: 0 }, ripples: [], hover: null, press: null };
const PTR = new Map();
addEventListener('keydown', e => {
  audInit();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (!e.repeat) pressed.add(e.code); down.add(e.code);
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => { down.clear(); TCH.held.clear(); TCH.joy.id = null; TCH.joy.ax = TCH.joy.ay = 0; PTR.clear(); });
const P = c => pressed.has(c), D = c => down.has(c);
const navX = () => ((P('ArrowRight') || P('KeyD')) ? 1 : 0) - ((P('ArrowLeft') || P('KeyA')) ? 1 : 0);
const navY = () => ((P('ArrowDown') || P('KeyS')) ? 1 : 0) - ((P('ArrowUp') || P('KeyW')) ? 1 : 0);
const OK = () => P('Enter') || P('Space'), BACK = () => P('Escape') || P('Backspace');

// Combat touch layout (virtual coords). Mirrors a classic mobile fighter: joystick left, action cluster right.
const JOY = { x: 232, y: 588, R: 92 };
const CBTN = [
  { id: 'charge', x: 160, y: 372, r: 52, keys: ['KeyK'], hint: 'K' },
  { id: 'attack', x: 1478, y: 612, r: 72, keys: ['KeyH'], hint: 'H' },
  { id: 's1', x: 1303, y: 655, r: 44, keys: ['KeyU'], hint: 'U' },
  { id: 's2', x: 1312, y: 552, r: 44, keys: ['KeyI'], hint: 'I' },
  { id: 'xform', x: 1405, y: 466, r: 44, keys: ['KeyT'], hint: 'T' },
  { id: 'block', x: 1517, y: 458, r: 44, keys: ['ShiftLeft', 'ShiftRight', 'KeyB'], hint: '⇧' },
  { id: 'dash', x: 1178, y: 657, r: 44, keys: ['Space'], hint: '␣' }
];
function moveJoy(x, y) {
  let dx = x - JOY.x, dy = y - JOY.y; const d = Math.hypot(dx, dy), k = d > JOY.R ? JOY.R / d : 1;
  TCH.joy.ax = dx * k / JOY.R; TCH.joy.ay = dy * k / JOY.R;
}
function releasePtr(e, fire) {
  const info = PTR.get(e.pointerId); if (!info) return; PTR.delete(e.pointerId);
  if (info.kind === 'btn') TCH.held.delete(info.id);
  else if (info.kind === 'joy') { TCH.joy.id = null; TCH.joy.ax = TCH.joy.ay = 0; }
  else if (info.kind === 'ui') {
    const press = TCH.press; TCH.press = null;
    if (fire && press) { const r = cv.getBoundingClientRect(), [x, y] = toV(e.clientX - r.left, e.clientY - r.top), h = Screens.hit(x, y); if (h && h.k === press.k) { sfx('click'); h.fn(); } }
  }
}
cv.addEventListener('pointerdown', e => {
  audInit(); cv.focus(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  toggleFullscreen(true);
  const r = cv.getBoundingClientRect(), [x, y] = toV(e.clientX - r.left, e.clientY - r.top);
  TCH.ripples.push({ x, y, t: 0 });
  const cs = Screens.cur;
  if (Screens.name === 'combat' && cs.arena && !cs.paused && !UI.modal) {
    for (const b of CBTN) if (Math.hypot(x - b.x, y - b.y) <= b.r + 10) { TCH.held.add(b.id); TCH.edge.add(b.id); PTR.set(e.pointerId, { kind: 'btn', id: b.id }); return; }
    if (x < 620 && y > 300 && TCH.joy.id === null) { TCH.joy.id = e.pointerId; PTR.set(e.pointerId, { kind: 'joy' }); moveJoy(x, y); return; }
  }
  const h = Screens.hit(x, y); if (h) { TCH.press = { id: e.pointerId, k: h.k }; PTR.set(e.pointerId, { kind: 'ui' }); }
});
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(), [x, y] = toV(e.clientX - r.left, e.clientY - r.top); TCH.hover = [x, y];
  const info = PTR.get(e.pointerId); if (info && info.kind === 'joy') moveJoy(x, y);
});
cv.addEventListener('pointerup', e => releasePtr(e, true));
cv.addEventListener('pointercancel', e => releasePtr(e, false));
cv.addEventListener('pointerleave', () => { if (!PTR.size) TCH.hover = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());

function readP1() {
  let x = ((D('KeyD') || D('ArrowRight')) ? 1 : 0) - ((D('KeyA') || D('ArrowLeft')) ? 1 : 0);
  let y = ((D('KeyS') || D('ArrowDown')) ? 1 : 0) - ((D('KeyW') || D('ArrowUp')) ? 1 : 0);
  if (Math.hypot(TCH.joy.ax, TCH.joy.ay) > 0.12) { x = TCH.joy.ax; y = TCH.joy.ay; }
  const HD = id => TCH.held.has(id), ED = id => TCH.edge.has(id), mag = Math.hypot(x, y);
  const dashE = P('Space') || ED('dash');
  return {
    x, y, charge: D('KeyK') || HD('charge'), blast: D('KeyJ'), attack: D('KeyH') || HD('attack'),
    s1: P('KeyU') || ED('s1'), s2: P('KeyI') || ED('s2'), block: D('ShiftLeft') || D('ShiftRight') || D('KeyB') || HD('block'),
    dash: dashE && (mag > 0.15 || P('Space')), vanish: P('KeyL') || (ED('dash') && mag <= 0.15),
    transform: P('KeyT') || ED('xform'), test: P('Digit1')
  };
}

/* ============================================================
   2. SAVE DATA  (coins, gems, upgrades, unlocked heroes, daily state)
   ============================================================ */
const UNLIMITED = true; // set to false to restore normal coin/gem costs
const SAVE_KEY = 'skw-save-v2';
const today = () => new Date().toISOString().slice(0, 10);
const SAVE = { coins: 3000, gems: 150, upg: { hp: 0, atk: 0, ki: 0 }, unlocked: ['kairo', 'vorn', 'rex'], wins: 0, opts: { music: true, sfx: true }, story: {}, dailyDay: '', spinDay: '', q: { day: '', wins: 0, waves: 0, charge: 0, claimed: {} } };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s.coins === 'number') { Object.assign(SAVE, s); SAVE.upg = Object.assign({ hp: 0, atk: 0, ki: 0 }, s.upg || {}); const mig = { saiyan: 'kairo', prince: 'vorn', future: 'rex', namek: 'zenji', emperor: 'nyx', android: 'omega' }; SAVE.unlocked = [...new Set((SAVE.unlocked || []).map(x => mig[x] || x))]; } } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }
function ensureDay() { if (SAVE.q.day !== today()) SAVE.q = { day: today(), wins: 0, waves: 0, charge: 0, claimed: {} }; }
function questAdd(k, v) { ensureDay(); SAVE.q[k] = (SAVE.q[k] || 0) + v; }
const fmt = n => Math.round(n).toLocaleString('en-US');

/* ============================================================
   2b. AUDIO  (WebAudio synth: sfx + procedural music, no asset files)
   ============================================================ */
const AUD = { ac: null, sfxG: null, musG: null, mode: 'menu', step: 0, next: 0, timer: null, ch: null, noiseBuf: null };
function audInit() {
  if (AUD.ac) { if (AUD.ac.state === 'suspended') AUD.ac.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext; AUD.ac = new AC();
    AUD.sfxG = AUD.ac.createGain(); AUD.sfxG.connect(AUD.ac.destination); AUD.musG = AUD.ac.createGain(); AUD.musG.connect(AUD.ac.destination);
    const b = AUD.ac.createBuffer(1, AUD.ac.sampleRate, AUD.ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; AUD.noiseBuf = b;
    applyVol(); AUD.next = AUD.ac.currentTime + 0.1; AUD.timer = setInterval(musicTick, 30);
  } catch (e) { AUD.ac = null; }
}
function applyVol() { if (!AUD.ac) return; AUD.sfxG.gain.value = SAVE.opts.sfx ? 0.55 : 0; AUD.musG.gain.value = SAVE.opts.music ? 0.2 : 0; }
function tone(f, d, type = 'square', v = 0.25, to = null, delay = 0, dest) {
  const ac = AUD.ac; if (!ac) return; const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(g); g.connect(dest || AUD.sfxG); o.start(t); o.stop(t + d + 0.03);
}
function noise(d, v = 0.3, f0 = 3000, f1 = 400, delay = 0, dest) {
  const ac = AUD.ac; if (!ac) return; const t = ac.currentTime + delay, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = AUD.noiseBuf; fl.type = 'bandpass'; fl.Q.value = 0.8; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); s.connect(fl); fl.connect(g); g.connect(dest || AUD.sfxG); s.start(t); s.stop(t + d + 0.03);
}
const SFXS = {
  click() { tone(900, 0.06, 'square', 0.14, 1400); },
  coin() { tone(988, 0.08, 'square', 0.18); tone(1319, 0.2, 'square', 0.18, null, 0.08); },
  swing() { noise(0.09, 0.22, 4200, 1400); },
  hit() { noise(0.12, 0.5, 2500, 300); tone(150, 0.12, 'sine', 0.5, 50); },
  crit() { noise(0.16, 0.6, 3500, 300); tone(160, 0.16, 'sine', 0.6, 40); tone(1000, 0.18, 'sawtooth', 0.18, 300); },
  block() { tone(1500, 0.1, 'triangle', 0.3, 900); noise(0.06, 0.3, 6000, 3000); },
  blast() { tone(750, 0.15, 'sawtooth', 0.16, 220); },
  beam() { noise(0.6, 0.45, 400, 3200); tone(110, 0.7, 'sawtooth', 0.28, 700); tone(440, 0.5, 'square', 0.1, 1200); },
  barrage() { for (let i = 0; i < 5; i++) tone(520 + i * 70, 0.1, 'sawtooth', 0.14, 200, i * 0.09); },
  dash() { noise(0.2, 0.4, 6000, 500); },
  vanish() { tone(1800, 0.22, 'sine', 0.22, 300); noise(0.16, 0.3, 5000, 800); },
  transform() { for (let i = 0; i < 8; i++) tone(220 * Math.pow(2, i / 4), 0.22, 'sawtooth', 0.14, null, i * 0.09); noise(1.1, 0.4, 300, 4500); tone(60, 1.2, 'sine', 0.5, 200); },
  ko() { tone(110, 0.9, 'sine', 0.7, 30); noise(0.7, 0.6, 1600, 100); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'square', 0.18, null, i * 0.12)); tone(1047, 0.6, 'triangle', 0.2, null, 0.5); },
  lose() { [392, 330, 262].forEach((f, i) => tone(f, 0.35, 'triangle', 0.25, null, i * 0.2)); },
  reward() { [659, 784, 988, 1319, 1568].forEach((f, i) => tone(f, 0.16, 'square', 0.14, null, i * 0.07)); },
  spin() { tone(1200, 0.03, 'square', 0.1, 800); }
};
function sfx(n) { if (!AUD.ac || !SAVE.opts.sfx) return; try { SFXS[n]?.(); } catch (e) {} }
function sfxCharge(on) {
  const ac = AUD.ac; if (!ac || !SAVE.opts.sfx) on = false;
  if (on && !AUD.ch) {
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter(); o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = 82; o2.frequency.value = 123; fl.type = 'lowpass'; fl.frequency.value = 500; g.gain.value = 0.0001;
    o.connect(fl); o2.connect(fl); fl.connect(g); g.connect(AUD.sfxG); o.start(); o2.start(); g.gain.exponentialRampToValueAtTime(0.14, ac.currentTime + 0.3); fl.frequency.exponentialRampToValueAtTime(2200, ac.currentTime + 2.5); o.frequency.exponentialRampToValueAtTime(220, ac.currentTime + 2.5);
    AUD.ch = { o, o2, g };
  } else if (!on && AUD.ch) { const c = AUD.ch; AUD.ch = null; try { c.g.gain.cancelScheduledValues(ac.currentTime); c.g.gain.setValueAtTime(c.g.gain.value, ac.currentTime); c.g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.12); c.o.stop(ac.currentTime + 0.15); c.o2.stop(ac.currentTime + 0.15); } catch (e) {} }
}
// procedural music: Am - F - C - G, calm for menus, driving for battle
const CHORDS = [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]];
const nf = s => 110 * Math.pow(2, s / 12);
function setMusic(m) { if (AUD.mode !== m) { AUD.mode = m; AUD.step = 0; if (AUD.ac) AUD.next = AUD.ac.currentTime + 0.05; } }
function musicTick() {
  const ac = AUD.ac; if (!ac || !SAVE.opts.music) { if (ac) AUD.next = Math.max(AUD.next, ac.currentTime); return; }
  const battle = AUD.mode === 'battle', bpm = battle ? 150 : 92, dur = 60 / bpm / 4;
  while (AUD.next < ac.currentTime + 0.15) {
    const s = AUD.step, bar = (s >> 4) & 3, st = s & 15, ch = CHORDS[bar], t = AUD.next - ac.currentTime;
    if (battle) {
      if (st % 4 === 0) { tone(150, 0.12, 'sine', 0.9, 40, t, AUD.musG); }
      if (st === 4 || st === 12) noise(0.1, 0.5, 2500, 1200, t, AUD.musG);
      if (st % 2 === 0) noise(0.03, 0.12, 9000, 8000, t, AUD.musG);
      if (st % 2 === 0) tone(nf(ch[0] - 12), dur * 1.8, 'sawtooth', 0.28, null, t, AUD.musG);
      tone(nf(ch[(st * 5) % 3] + 12 + (st % 8 === 7 ? 12 : 0)), dur * 1.5, 'square', 0.09, null, t, AUD.musG);
    } else {
      if (st % 8 === 0) tone(nf(ch[0] - 12), dur * 7, 'triangle', 0.5, null, t, AUD.musG);
      if (st % 2 === 0) tone(nf(ch[(st >> 1) % 3] + 12), dur * 2.4, 'sine', 0.22, null, t, AUD.musG);
      if (st === 0) for (const n of ch) tone(nf(n), dur * 15, 'triangle', 0.12, null, t, AUD.musG);
    }
    AUD.step++; AUD.next += dur;
  }
}
function toggleFullscreen(auto) {
  try {
    const d = document, e = d.documentElement;
    if (!d.fullscreenElement) { (e.requestFullscreen || e.webkitRequestFullscreen)?.call(e); screen.orientation?.lock?.('landscape').catch(() => {}); }
    else if (!auto) d.exitFullscreen?.();
  } catch (e) {}
}
